 let rows='';

   const order=['date','number','receipt','purchase','partyName','supplier','amount','total','paid','method','reference','category','description','note','phone','address','status'];

 return `<div class="panel" style="padding:12px"><div class="tablewrap"><table class="detailtable"><tbody>${rows}</tbody></table></div>${items}<div class="sub" style="margin-top:12px">রেকর্ডের preserved তথ্য · কোনো তথ্য পরিবর্তন করা হয়নি</div></div>`;
}

function receiptPdfBytes(rec){
 const party=db.parties.find(p=>p.id===rec.partyId)||{},b=db.business||{};
 const ascii=v=>String(v??'').normalize('NFKD').replace(/[^\x20-\x7E]/g,' ').replace(/\s+/g,' ').trim();
 const lines=[ascii(b.name||'TANISHA DRESSES'),'PAYMENT RECEIPT','Receipt No: '+ascii(rec.number||rec.receipt||rec.id),'Date: '+ascii(rec.date),'Received From: '+ascii(rec.partyName||party.name||'Customer'),'Mobile: '+ascii(party.phone||''),'Amount Received: '+money(rec.amount),'Payment Method: '+ascii(rec.method||''),'Note: '+ascii(rec.note||''),'','Thank you for your payment.','','PAYMENT DETAILS',ascii(b.paymentNote||'')];
 const esc=v=>String(v).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
 let stream='BT\n/F1 16 Tf\n50 790 Td\n('+esc(lines[0])+') Tj\n/F1 14 Tf\n0 -30 Td\n('+esc(lines[1])+') Tj\n/F1 11 Tf\n';
 for(let i=2;i<lines.length;i++)stream+='0 -22 Td\n('+esc(lines[i]).slice(0,115)+') Tj\n';
 stream+='ET';
 const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>','<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream'];
 let pdf='%PDF-1.4\n',offsets=[0];for(let i=0;i<objs.length;i++){offsets.push(pdf.length);pdf+=(i+1)+' 0 obj\n'+objs[i]+'\nendobj\n'}let xref=pdf.length;pdf+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';for(let i=1;i<offsets.length;i++)pdf+=String(offsets[i]).padStart(10,'0')+' 00000 n \n';pdf+='trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';return new Blob([pdf],{type:'application/pdf'});
}

async function compareBackupFiles(){
 const appFile=document.getElementById('compareAppFile')?.files?.[0], cloudFile=document.getElementById('compareCloudFile')?.files?.[0], out=document.getElementById('backupCompareResult');
 if(!appFile||!cloudFile){out.innerHTML='<div class="notice">দয়া করে App Backup এবং Cloud Backup—দুটি ফাইলই বাছুন।</div>';return}
 const size=n=>n<1024*1024?(n/1024).toFixed(1)+' KB':(n/1024/1024).toFixed(2)+' MB';
 const unwrap=x=>{let d=x;for(let i=0;i<3&&d&&typeof d==='object'&&!Array.isArray(d);i++){if(d.data&&typeof d.data==='object'&&!Array.isArray(d.data)){d=d.data;continue}if(d.backup&&typeof d.backup==='object'){d=d.backup;continue}if(d.business_data&&typeof d.business_data==='object'){d=d.business_data;continue}break}return d||{}};
 const parse=async f=>unwrap(JSON.parse(await f.text()));
 const aliases=[['Party',['parties','customers','suppliers']],['Product',['products','items','inventory']],['Salesর Invoices',['sales','salesInvoices','invoices','salesInvoicesArchive']],['টাকা Received',['receipts','receives','paymentsReceived','customerReceipts']],['ক্রয়',['purchases','purchaseInvoices']],['Supplier Payment',['supplierPayments','paymentsToSuppliers','supplierPaymentsList']],['Expenses',['expenses','expenseEntries']],['Karigar',['workers','karigars','tailors']],['মজুরি Entries',['workerEntries','wageEntries','karigarEntries','productionCosts']],['কারিগর Payment',['workerPayments','wagePayments','karigarPayments']],['Reminders',['reminders','orderReminders']],['রিকোয়েস্ট',['requests','orders']],['Stock লট',['stockLots','lots']],['Sewing থেকে Stock',['productionReceipts','productionEntries']]];
 const getArray=(d,keys)=>{for(const k of keys){if(Array.isArray(d?.[k]))return {value:d[k],path:k};if(Array.isArray(d?.archiveData?.[k]))return {value:d.archiveData[k],path:'archiveData.'+k};}if(keys.includes('salesInvoicesArchive')&&Array.isArray(d?.archiveData?.salesInvoicesArchive))return {value:d.archiveData.salesInvoicesArchive,path:'archiveData.salesInvoicesArchive'};return {value:null,path:''}};
 const count=(d,keys)=>{const x=getArray(d,keys);return x.value===null?null:x.value.length};
 const recordKey=x=>String(x?.id||[x?.date,x?.supplier||x?.partyName||x?.name,x?.amount,x?.method,x?.note].join('|'));
 try{
  out.innerHTML='<div class="notice">ফাইল পড়া হচ্ছে…</div>';
  const [a,c]=await Promise.all([parse(appFile),parse(cloudFile)]);
  const rows=aliases.map(([label,keys])=>{let av=count(a,keys),cv=count(c,keys);return `<tr><td>${label}</td><td class="right">${av===null?'ফাইলে নেই':av}</td><td class="right">${cv===null?'ফাইলে নেই':cv}</td><td>${av===null||cv===null?'তথ্য একদিকে নেই':av===cv?'সংখ্যা সমান':'সংখ্যা আলাদা'}</td></tr>`}).join('');
  const different=aliases.filter(([l,k])=>{let av=count(a,k),cv=count(c,k);return av!==null&&cv!==null&&av!==cv}).length;
  const ap=getArray(a,['supplierPayments','paymentsToSuppliers','supplierPaymentsList']).value;
  const cp=getArray(c,['supplierPayments','paymentsToSuppliers','supplierPaymentsList']).value;
  let paymentDetail='<div class="notice">মহাজন Paymentের বিস্তারিত রেকর্ড দুই ফাইলে একসঙ্গে পাওয়া যায়নি।</div>';
  if(ap!==null&&cp!==null){
   const am=new Map(ap.map(x=>[recordKey(x),x])), cm=new Map(cp.map(x=>[recordKey(x),x]));
   const onlyA=[...am.keys()].filter(k=>!cm.has(k)).map(k=>am.get(k));
   const onlyC=[...cm.keys()].filter(k=>!am.has(k)).map(k=>cm.get(k));
   const total=x=>x.reduce((n,r)=>n+Number(r?.amount||r?.total||0),0);
   const matched=Math.min(am.size,cm.size)-Math.min(onlyA.length,onlyC.length);
   const detailRows=[...onlyA.map(x=>`<tr><td>শুধু App</td><td>${esc(x.date||'')}</td><td>${esc(x.supplier||x.partyName||'')}</td><td class="right">₹${Number(x.amount||0).toLocaleString('en-IN')}</td><td>${esc(x.method||'')}</td></tr>`),...onlyC.map(x=>`<tr><td>শুধু Cloud</td><td>${esc(x.date||'')}</td><td>${esc(x.supplier||x.partyName||'')}</td><td class="right">₹${Number(x.amount||0).toLocaleString('en-IN')}</td><td>${esc(x.method||'')}</td></tr>`)];
   paymentDetail=`<h4 style="margin:14px 0 6px">মহাজন Payment — রেকর্ড মিল</h4><div class="notice">App: ${ap.length}টি, Total ₹${total(ap).toLocaleString('en-IN')} (${esc(getArray(a,['supplierPayments']).path||getArray(a,['supplierPayments']).path||'অন্য সংরক্ষণস্থান')})<br>Cloud: ${cp.length}টি, Total ₹${total(cp).toLocaleString('en-IN')}<br>একই রেকর্ডের ID/Date-নাম-অঙ্ক-মাধ্যম মিলিয়ে App-এ শুধু থাকা ${onlyA.length}টি; Cloud-এ শুধু থাকা ${onlyC.length}টি।</div>`+
    (detailRows.length?`<div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>কোথায়</th><th>Date</th><th>মহাজন</th><th class="right">টাকা</th><th>মাধ্যম</th></tr></thead><tbody>${detailRows.join('')}</tbody></table></div>`:'<div class="notice" style="margin-top:8px">দুটি ফাইলে মহাজন Paymentের সব রেকর্ড মিলে গেছে।</div>');
  }
  out.innerHTML=`<div class="notice"><b>শুধু পড়ে তুলনা সম্পন্ন হয়েছে।</b><br>App Backup: ${esc(appFile.name)} (${size(appFile.size)})<br>Cloud Backup: ${esc(cloudFile.name)} (${size(cloudFile.size)})<br>দুই ফাইলেই থাকা বিভাগগুলির মধ্যে ${different} বিভাগে সংখ্যার পার্থক্য আছে।</div><div class="tablewrap" style="margin-top:10px"><table><thead><tr><th>হিসাবের Type</th><th class="right">App Backup</th><th class="right">Cloud Backup</th><th>ফল</th></tr></thead><tbody>${rows}</tbody></table></div>${paymentDetail}<p class="muted" style="margin-top:8px">এটি রেকর্ডের সংখ্যা ও মহাজন Paymentের পরিচয়-ভিত্তিক মিল পরীক্ষা। অন্য বিভাগের একই সংখ্যার অর্থ একই রেকর্ড নয়। কোনও ফাইল Restore, Save বা Cloud-এ Upload করা হয়নি।</p>`;
 }catch(e){out.innerHTML=`<div class="notice" style="color:#9a3333">ফাইল পড়া যায়নি: ${esc(e.message||String(e))}. সঠিক JSON ব্যাকআপ ফাইল বাছুন।</div>`}
}
function restoreFile(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!d||d.schema!==1||!Array.isArray(d.parties)||!Array.isArray(d.products)||!d.business)throw Error('This file is not a valid TANISHA DRESSES app backup');if(!confirm('Restore will replace current device data. A safety backup will be downloaded first. Continue?'))return;if(prompt('Type RESTORE to confirm replacing current device data:')!=='RESTORE')return;download('TANISHA_DRESSES_before_restore_'+dateNow()+'.json',JSON.stringify(db,null,2),'application/json');db=separatePartyRoles({...empty(),...d,business:{...empty().business,...d.business},settings:{...empty().settings,...d.settings},meta:{...d.meta,cloudConnected:false}});save();toast('Restore completed')}catch(err){alert('Restore failed: '+err.message+'. Legacy ERP backups are not accepted directly.')}};reader.readAsText(file);e.target.value=''}
